services:
  db:
    image: postgres:17
    container_name: registrak-db
    environment:
      POSTGRES_USER: registrak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: registrak
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registrak -d registrak"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: